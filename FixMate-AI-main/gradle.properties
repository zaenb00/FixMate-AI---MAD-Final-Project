# Project-wide Gradle settings.

# Increase the JVM heap for faster builds on modern machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run tasks in parallel where possible.
org.gradle.parallel=true

# Enable the Gradle build cache.
org.gradle.caching=true

# AndroidX is required for all modern dependencies.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resources for the configurations declared in the build.
android.nonTransitiveRClass=true
